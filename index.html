<style>
  :root { --navy:#1E3A60; --orange:#F2B42C; --green:#2E9B6A; --bg:#ffffff; --muted:#5B6B82; --tint:#EEF2F8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; } html { overflow-x:hidden; }
  body {
    background:var(--bg); color:var(--navy);
    font-family:'Poppins', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:32px 16px 70px; text-align:center;
    overflow-x:hidden; position:relative;
  }

  /* Floating speech bubbles in the background */
  .sky { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .b {
    position:absolute; bottom:-90px; width:var(--s); height:calc(var(--s) * .82);
    background:#fff; border:1.5px solid #DCE3EE; border-radius:calc(var(--s) * .24);
    box-shadow:0 6px 18px rgba(30,58,96,.08);
    display:flex; align-items:center; justify-content:center;
    opacity:0; animation:rise var(--d) linear var(--delay) infinite;
  }
  .b::before, .b::after {
    content:""; position:absolute; left:20%; width:0; height:0;
    border-left:calc(var(--s) * .11) solid transparent;
    border-right:calc(var(--s) * .11) solid transparent;
  }
  .b::before { bottom:calc(var(--s) * -.19); border-top:calc(var(--s) * .19) solid #DCE3EE; }
  .b::after  { bottom:calc(var(--s) * -.15); border-top:calc(var(--s) * .17) solid #fff;
               border-left-width:calc(var(--s) * .09); border-right-width:calc(var(--s) * .09); margin-left:calc(var(--s) * .02); }
  .b .fi { width:60%; aspect-ratio:4/3; border-radius:2px; background-size:100% 100%; box-shadow:0 0 0 .5px rgba(0,0,0,.12); }
  @keyframes rise {
    0%   { transform:translateY(0) rotate(-4deg); opacity:0; }
    10%  { opacity:.75; }
    50%  { transform:translateY(-55vh) translateX(18px) rotate(4deg); }
    90%  { opacity:.75; }
    100% { transform:translateY(-115vh) rotate(-4deg); opacity:0; }
  }

  main { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; isolation:isolate; }
  main::before {
    content:""; position:absolute; inset:-60px -40px; z-index:-1; pointer-events:none;
    background:radial-gradient(closest-side, #fff 72%, rgba(255,255,255,0));
  }

  .logo { width:min(460px, 82vw); height:auto; overflow:visible; direction:ltr; unicode-bidi:isolate; }
  .bubble { transform-origin:50px 90px; animation:pop .7s cubic-bezier(.34,1.56,.64,1) .1s both; }
  .dot { transform-origin:99px 1px; animation:dotIn .5s cubic-bezier(.34,1.56,.64,1) .8s both, ping 2.6s ease-in-out 1.6s infinite; }
  .ring { transform-origin:99px 1px; fill:none; stroke:var(--orange); stroke-width:3; opacity:0; animation:ring 2.6s ease-out 1.6s infinite; }
  .word { animation:slideIn .8s cubic-bezier(.22,1,.36,1) .45s both; }
  /* توقيع "space" الأخضر تحت الشعار — يظهر كأنه يُكتب باليد بعد الاسم */
  .sig { animation:sigIn .9s cubic-bezier(.22,1,.36,1) 1s both; transform-origin:566px 150px; }
  @keyframes sigIn { from { opacity:0; transform:translateY(8px) rotate(-8deg); } to { opacity:1; transform:rotate(-4deg); } }


  @keyframes pop     { from { transform:scale(0) rotate(-12deg); } to { transform:scale(1) rotate(0); } }
  @keyframes dotIn   { from { transform:scale(0); } to { transform:scale(1); } }
  @keyframes ping    { 0%,70%,100% { transform:scale(1); } 78% { transform:scale(1.25); } 86% { transform:scale(.95); } }
  @keyframes ring    { 0%,65% { opacity:0; transform:scale(1); } 70% { opacity:.8; } 100% { opacity:0; transform:scale(2.4); } }
  @keyframes slideIn { from { opacity:0; transform:translateX(-24px); } to { opacity:1; transform:none; } }
  @keyframes fadeUp  { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

  .soon {
    margin-top:44px; display:inline-flex; align-items:center; gap:4px;
    font-weight:600; font-size:14px; letter-spacing:.22em; text-transform:uppercase;
    animation:fadeUp .7s ease 1.1s both;
  }
  .soon .dots span {
    display:inline-block; width:5px; height:5px; margin-left:4px; border-radius:50%;
    background:var(--orange); animation:typing 1.4s ease-in-out infinite;
  }
  .soon .dots span:nth-child(2) { animation-delay:.2s; }
  .soon .dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes typing { 0%,60%,100% { transform:translateY(0); opacity:.4; } 30% { transform:translateY(-6px); opacity:1; } }

  .bio {
    margin-top:18px; max-width:30ch; color:var(--muted);
    font-size:clamp(16px, 2.2vw, 19px); line-height:1.6;
    animation:fadeUp .7s ease 1.35s both;
  }
  html[dir="rtl"] body, html[dir="rtl"] .bio, html[dir="rtl"] .wl { font-family:'Tajawal','Poppins',system-ui,sans-serif; }
  html[dir="rtl"] .soon { letter-spacing:0; font-size:16px; }
  .lang { position:fixed; top:16px; inset-inline-end:16px; z-index:3; background:#fff; border:1.5px solid #DCE3EE;
    color:var(--navy); border-radius:999px; padding:7px 16px; font:600 14px 'Tajawal','Poppins',sans-serif; cursor:pointer;
    box-shadow:0 4px 14px rgba(30,58,96,.08); }
  .lang:hover { border-color:var(--navy); }
  .wl { margin-top:28px; width:min(560px, 92vw); position:relative; animation:fadeUp .7s ease 1.6s both; }
  .wl h2 { font-size:18px; font-weight:600; margin-bottom:12px; }
  .wl form { display:flex; gap:8px; background:#fff; border:1.5px solid #DCE3EE; border-radius:16px; padding:6px;
    box-shadow:0 10px 28px -12px rgba(30,58,96,.25); }
  .wl input[type=email] { flex:1; min-width:0; border:none; outline:none; font-family:inherit; font-size:16px; font-weight:500;
    padding:12px 12px; color:var(--navy); background:transparent; }
  .wl button { border:none; border-radius:12px; background:var(--navy); color:#fff; font-family:inherit; font-size:15px; font-weight:600;
    padding:12px 18px; cursor:pointer; white-space:nowrap; transition:transform .15s, background .2s; }
  .wl button:hover { background:#16304F; transform:translateY(-1px); }
  .wl button:disabled { opacity:.6; cursor:wait; }
  .wl .hp { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); opacity:0; pointer-events:none; }
  .wl .msg { min-height:24px; margin-top:10px; font-size:15px; font-weight:500; }
  .wl .msg.ok { color:var(--green); } .wl .msg.err { color:#C2410C; }
  .wl select { border:none; outline:none; background:#F3F6FB; border-radius:10px; color:var(--navy);
    font-family:inherit; font-size:14px; padding:0 8px; max-width:150px; cursor:pointer; }
  .wl .live[hidden] { display:none; }
  .wl .live { margin-top:14px; display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600;
    background:#fff; border:1.5px solid #DCE3EE; border-radius:999px; padding:6px 14px; }
  .wl .pulse { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(46,155,106,.6);
    animation:pulse 1.8s infinite; }
  @keyframes pulse { 70% { box-shadow:0 0 0 10px rgba(46,155,106,0); } 100% { box-shadow:0 0 0 0 rgba(46,155,106,0); } }
  @media (max-width:420px) { .wl select { max-width:none; padding:12px 8px; } }
  .wl .note { margin-top:4px; font-size:12.5px; color:var(--muted); }
  @media (max-width:420px) { .wl form { flex-direction:column; } .wl button { width:100%; } }
  footer { position:fixed; bottom:18px; z-index:1; font-size:12px; color:var(--muted); opacity:.7; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; }
    .b { display:none; }
    .sig { transform:rotate(-4deg); }
  }
</style>

  <main>

<script>
// ================= Waitlist + language =================
// ضع هنا بيانات مشروع Supabase (Project URL + anon/publishable key) — المفتاح العام آمن للعرض
// لأن الجدول محمي بسياسة RLS تسمح بالإضافة فقط، ولا تسمح لأحد بقراءة الإيميلات.
const SUPABASE_URL = "https://jtvlrjogrxuujobtmqwl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_OfZoMp4lFeufu1qEPOvL8A_AW9zFHTO";
// يعمل مع المفتاح القديم (anon — يبدأ بـ eyJ) والجديد (publishable — يبدأ بـ sb_publishable_)
function sbHeaders() {
  const h = { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" };
  if (SUPABASE_ANON_KEY.startsWith("eyJ")) h["Authorization"] = "Bearer " + SUPABASE_ANON_KEY;
  return h;
}

(() => {
  const T = {
    en: { soon:"Coming soon", bio:"The global network for teachers only. Share lessons, ideas & methods with educators worldwide.",
          wlTitle:"Be the first to join — get notified at launch", ph:"Your email address", btn:"Join the waitlist",
          note:"No spam. Only one email when we launch.", ok:"You're on the list! We'll email you at launch. 🎉",
          dup:"You're already on the list — see you at launch! 🎉", bad:"Please enter a valid email address.",
          fail:"Something went wrong. Please try again in a moment.", sending:"Joining…", lang:"العربية",
          title:"Teachory Space — Coming Soon", country:"Country",
          live:(n,c)=>`${n} teachers from ${c} ${c==1?"country":"countries"} are already waiting` },
    ar: { soon:"قريبًا", bio:"الشبكة العالمية للمعلمين فقط. شارك دروسك وأفكارك وأساليبك مع معلمين من كل أنحاء العالم.",
          wlTitle:"كن من أوائل المنضمين — ونخبرك لحظة الإطلاق", ph:"بريدك الإلكتروني", btn:"انضم لقائمة الانتظار",
          note:"بدون إزعاج. رسالة واحدة فقط عند الإطلاق.", ok:"تمت إضافتك إلى القائمة! سنراسلك عند الإطلاق 🎉",
          dup:"أنت مسجّل معنا مسبقًا — نلقاك عند الإطلاق! 🎉", bad:"يرجى إدخال بريد إلكتروني صحيح.",
          fail:"حدث خطأ ما. حاول مرة أخرى بعد قليل.", sending:"جارٍ التسجيل…", lang:"English",
          title:"Teachory Space — قريبًا", country:"الدولة",
          live:(n,c)=>`${n} معلمًا من ${c} ${c==1?"دولة":"دول"} ينتظرون الإطلاق` }
  };
  let lang = "en";
  try { lang = localStorage.getItem("ts-lang") || ((navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en"); } catch (e) {}
  const $ = id => document.getElementById(id);
  function apply(l) {
    lang = l; const t = T[l];
    document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
    document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t[el.dataset.i18nPh]);
    $("lang").textContent = t.lang; document.title = t.title;
    const m = $("wl-msg"); if (m.dataset.key) m.textContent = t[m.dataset.key];
    try { localStorage.setItem("ts-lang", l); } catch (e) {}
  }
  const CODES = "AF AL DZ AD AO AG AR AM AU AT AZ BS BH BD BB BY BE BZ BJ BT BO BA BW BR BN BG BF BI KH CM CA CV CF TD CL CN CO KM CG CD CR CI HR CU CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FJ FI FR GA GM GE DE GH GR GD GT GN GW GY HT HN HK HU IS IN ID IR IQ IE IL IT JM JP JO KZ KE KI KW KG LA LV LB LS LR LY LI LT LU MO MG MW MY MV ML MT MH MR MU MX FM MD MC MN ME MA MZ MM NA NR NP NL NZ NI NE NG KP MK NO OM PK PW PS PA PG PY PE PH PL PT PR QA RO RU RW KN LC VC WS SM ST SA SN RS SC SL SG SK SI SB SO ZA KR SS ES LK SD SR SE CH SY TW TJ TZ TH TL TG TO TT TN TR TM TV UG UA AE GB US UY UZ VU VA VE VN YE ZM ZW".split(" ");
  const flag = c => c.replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)));
  let region = "";
  try { region = (new Intl.Locale(navigator.language)).region || ""; } catch (e) {}
  if (!region && lang === "ar") region = "JO";
  function fillCountries() {
    const sel = $("wl-country"), keep = sel.value || region;
    let names; try { names = new Intl.DisplayNames([lang], { type: "region" }); } catch (e) { names = { of: c => c }; }
    const opts = CODES.map(c => [c, names.of(c) || c]).sort((a, b) => a[1].localeCompare(b[1], lang));
    sel.innerHTML = `<option value="">🌍 ${T[lang].country}</option>` + opts.map(([c, n]) => `<option value="${c}">${flag(c)} ${n}</option>`).join("");
    if (CODES.includes(keep)) sel.value = keep;
    sel.setAttribute("aria-label", T[lang].country);
  }
  // عدّاد حيّ: عدد المسجّلين وعدد الدول (من دالة آمنة لا تكشف أي إيميل)
  let stats = null;
  function paintLive() {
    const box = $("wl-live");
    if (!stats || stats.total < 10) { box.hidden = true; return; }   // يظهر فقط بعد أول 10 مسجّلين
    $("wl-live-txt").textContent = T[lang].live(stats.total, Math.max(1, stats.countries)); box.hidden = false;
  }
  async function loadStats() {
    if (SUPABASE_URL.startsWith("PASTE")) return;
    try {
      const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/waitlist_stats", { method: "POST",
        headers: sbHeaders(), body: "{}" });
      if (r.ok) { const d = await r.json(); stats = Array.isArray(d) ? d[0] : d; paintLive(); }
    } catch (e) {}
  }
  const _apply = apply; apply = l => { _apply(l); fillCountries(); paintLive(); };
  $("lang").addEventListener("click", () => apply(lang === "en" ? "ar" : "en"));
  apply(lang);
  loadStats();

  const say = (key, cls) => { const m = $("wl-msg"); m.dataset.key = key; m.className = "msg " + (cls || ""); m.textContent = T[lang][key]; };
  $("wl-form").addEventListener("submit", async e => {
    e.preventDefault();
    if ($("wl-hp").value) return;                      // bot trap
    const email = $("wl-email").value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) || email.length > 254) { say("bad", "err"); return; }
    const btn = $("wl-btn"); btn.disabled = true; btn.textContent = T[lang].sending;
    try {
      const r = await fetch(SUPABASE_URL + "/rest/v1/waitlist", {
        method: "POST",
        headers: Object.assign(sbHeaders(), { "Prefer": "return=minimal" }),
        body: JSON.stringify({ email, lang, country: $("wl-country").value || null, source: location.hostname || "local" })
      });
      if (r.ok) { say("ok", "ok"); $("wl-email").value = ""; loadStats(); }
      else if (r.status === 409) { say("dup", "ok"); $("wl-email").value = ""; }
      else { say("fail", "err"); }
    } catch (err) { say("fail", "err"); }
    btn.disabled = false; btn.textContent = T[lang].btn;
  });
})();
</script>
<script>
(() => {
  // ---- tiny inline flag painter (24x18 viewBox) ----
  const W = 24, H = 18;
  const R = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
  const hs = (cs, ws) => { ws = ws || cs.map(() => 1); const t = ws.reduce((a, b) => a + b); let y = 0;
    return cs.map((c, i) => { const h = H * ws[i] / t, r = R(0, y, W, h + .05, c); y += h; return r; }).join(""); };
  const vs = (cs, ws) => { ws = ws || cs.map(() => 1); const t = ws.reduce((a, b) => a + b); let x = 0;
    return cs.map((c, i) => { const w = W * ws[i] / t, r = R(x, 0, w + .05, H, c); x += w; return r; }).join(""); };
  const P = (pts, c) => `<polygon points="${pts}" fill="${c}"/>`;
  const C = (cx, cy, r, c) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>`;
  const star = (cx, cy, r, c, n = 5, rot = -90, inner = .38) => { let p = [];
    for (let i = 0; i < n * 2; i++) { const rr = i % 2 ? r * inner : r, a = (rot + i * 180 / n) * Math.PI / 180;
      p.push((cx + rr * Math.cos(a)).toFixed(2) + "," + (cy + rr * Math.sin(a)).toFixed(2)); }
    return P(p.join(" "), c); };
  const cres = (cx, cy, r, c, bg, dx = .3) => C(cx, cy, r, c) + C(cx + r * dx, cy, r * .8, bg);
  const nordic = (bg, c1, c2) => R(0, 0, W, H, bg) + R(6.5, 0, 4, H, c1) + R(0, 7, W, 4, c1) + (c2 ? R(7.5, 0, 2, H, c2) + R(0, 8, W, 2, c2) : "");
