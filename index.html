<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teachory — Coming Soon</title>
<meta name="description" content="The global network for teachers only. Share lessons, ideas & methods with educators worldwide.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-6 -14 124 124'%3E%3Crect x='0' y='0' width='100' height='82' rx='20' fill='%231E3A60'/%3E%3Cpolygon points='18,80 42,80 14,102' fill='%231E3A60'/%3E%3Crect x='24' y='22' width='52' height='11' rx='5.5' fill='%23fff'/%3E%3Crect x='44' y='22' width='12' height='42' rx='6' fill='%23fff'/%3E%3Ccircle cx='99' cy='1' r='10' fill='%23E0763C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1E3A60; --orange:#E0763C; --bg:#ffffff; --muted:#5B6B82; --tint:#EEF2F8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--navy);
    font-family:'Poppins', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:32px 16px; text-align:center;
    overflow:hidden; position:relative;
  }

  /* Floating speech bubbles in the background */
  .sky { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .b {
    position:absolute; bottom:-90px; width:var(--s); height:calc(var(--s) * .82);
    background:#fff; border:1.5px solid #DCE3EE; border-radius:calc(var(--s) * .24);
    box-shadow:0 6px 18px rgba(30,58,96,.08);
    display:flex; align-items:center; justify-content:center;
    opacity:0; animation:rise var(--d) linear var(--delay) infinite;
  }
  .b::before, .b::after {
    content:""; position:absolute; left:20%; width:0; height:0;
    border-left:calc(var(--s) * .11) solid transparent;
    border-right:calc(var(--s) * .11) solid transparent;
  }
  .b::before { bottom:calc(var(--s) * -.19); border-top:calc(var(--s) * .19) solid #DCE3EE; }
  .b::after  { bottom:calc(var(--s) * -.15); border-top:calc(var(--s) * .17) solid #fff;
               border-left-width:calc(var(--s) * .09); border-right-width:calc(var(--s) * .09); margin-left:calc(var(--s) * .02); }
  .b .fi { width:60%; aspect-ratio:4/3; border-radius:2px; background-size:100% 100%; box-shadow:0 0 0 .5px rgba(0,0,0,.12); }
  @keyframes rise {
    0%   { transform:translateY(0) rotate(-4deg); opacity:0; }
    10%  { opacity:.75; }
    50%  { transform:translateY(-55vh) translateX(18px) rotate(4deg); }
    90%  { opacity:.75; }
    100% { transform:translateY(-115vh) rotate(-4deg); opacity:0; }
  }

  main { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; isolation:isolate; }
  main::before {
    content:""; position:absolute; inset:-60px -40px; z-index:-1; pointer-events:none;
    background:radial-gradient(closest-side, #fff 72%, rgba(255,255,255,0));
  }

  .logo { width:min(460px, 82vw); height:auto; overflow:visible; }
  .bubble { transform-origin:50px 90px; animation:pop .7s cubic-bezier(.34,1.56,.64,1) .1s both; }
  .dot { transform-origin:99px 1px; animation:dotIn .5s cubic-bezier(.34,1.56,.64,1) .8s both, ping 2.6s ease-in-out 1.6s infinite; }
  .ring { transform-origin:99px 1px; fill:none; stroke:var(--orange); stroke-width:3; opacity:0; animation:ring 2.6s ease-out 1.6s infinite; }
  .word { animation:slideIn .8s cubic-bezier(.22,1,.36,1) .45s both; }

  @keyframes pop     { from { transform:scale(0) rotate(-12deg); } to { transform:scale(1) rotate(0); } }
  @keyframes dotIn   { from { transform:scale(0); } to { transform:scale(1); } }
  @keyframes ping    { 0%,70%,100% { transform:scale(1); } 78% { transform:scale(1.25); } 86% { transform:scale(.95); } }
  @keyframes ring    { 0%,65% { opacity:0; transform:scale(1); } 70% { opacity:.8; } 100% { opacity:0; transform:scale(2.4); } }
  @keyframes slideIn { from { opacity:0; transform:translateX(-24px); } to { opacity:1; transform:none; } }
  @keyframes fadeUp  { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

  .soon {
    margin-top:44px; display:inline-flex; align-items:center; gap:4px;
    font-weight:600; font-size:14px; letter-spacing:.22em; text-transform:uppercase;
    animation:fadeUp .7s ease 1.1s both;
  }
  .soon .dots span {
    display:inline-block; width:5px; height:5px; margin-left:4px; border-radius:50%;
    background:var(--orange); animation:typing 1.4s ease-in-out infinite;
  }
  .soon .dots span:nth-child(2) { animation-delay:.2s; }
  .soon .dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes typing { 0%,60%,100% { transform:translateY(0); opacity:.4; } 30% { transform:translateY(-6px); opacity:1; } }

  .bio {
    margin-top:18px; max-width:30ch; color:var(--muted);
    font-size:clamp(16px, 2.2vw, 19px); line-height:1.6;
    animation:fadeUp .7s ease 1.35s both;
  }
  footer { position:fixed; bottom:18px; z-index:1; font-size:12px; color:var(--muted); opacity:.7; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; }
    .b { display:none; }
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <i class="b jo" style="--s:64px; left:8%; --d:15s; --delay:-5s"><span class="fi"></span></i>
    <i class="b" style="--s:36px; left:15%; --d:13s; --delay:4s"><span class="fi"></span></i>
    <i class="b jo" style="--s:56px; left:74%; --d:17s; --delay:-13s"><span class="fi"></span></i>
    <i class="b" style="--s:40px; left:41%; --d:15s; --delay:2s"><span class="fi"></span></i>
    <i class="b" style="--s:48px; left:55%; --d:19s; --delay:10s"><span class="fi"></span></i>
    <i class="b" style="--s:58px; left:70%; --d:16s; --delay:5s"><span class="fi"></span></i>
    <i class="b" style="--s:34px; left:84%; --d:14s; --delay:1s"><span class="fi"></span></i>
    <i class="b" style="--s:44px; left:93%; --d:18s; --delay:7s"><span class="fi"></span></i>
    <i class="b" style="--s:38px; left:22%; --d:16s; --delay:12s"><span class="fi"></span></i>
    <i class="b" style="--s:54px; left:64%; --d:20s; --delay:14s"><span class="fi"></span></i>
  </div>

  <main>
    <svg class="logo" viewBox="-4 -14 594 128" role="img" aria-label="Teachory">
      <g class="bubble">
        <rect x="0" y="0" width="100" height="82" rx="20" fill="#1E3A60"/>
        <polygon points="18,80 42,80 14,102" fill="#1E3A60"/>
        <rect x="24" y="22" width="52" height="11" rx="5.5" fill="#fff"/>
        <rect x="44" y="22" width="12" height="42" rx="6" fill="#fff"/>
      </g>
      <circle class="ring" cx="99" cy="1" r="10"/>
      <circle class="dot" cx="99" cy="1" r="10" fill="#E0763C"/>
      <text class="word" x="110" y="82" font-family="Poppins, system-ui, sans-serif" font-weight="700" font-size="111" fill="#1E3A60">eachory</text>
    </svg>

    <p class="soon">Coming soon<span class="dots"><span></span><span></span><span></span></span></p>
    <p class="bio">The global network for teachers only. Share lessons, ideas &amp; methods with educators worldwide.</p>
  </main>

  <footer>© 2026 Teachory</footer>
<script>
(() => {
  // ---- tiny inline flag painter (24x18 viewBox) ----
  const W = 24, H = 18;
  const R = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
  const hs = (cs, ws) => { ws = ws || cs.map(() => 1); const t = ws.reduce((a, b) => a + b); let y = 0;
    return cs.map((c, i) => { const h = H * ws[i] / t, r = R(0, y, W, h + .05, c); y += h; return r; }).join(""); };
  const vs = (cs, ws) => { ws = ws || cs.map(() => 1); const t = ws.reduce((a, b) => a + b); let x = 0;
    return cs.map((c, i) => { const w = W * ws[i] / t, r = R(x, 0, w + .05, H, c); x += w; return r; }).join(""); };
  const P = (pts, c) => `<polygon points="${pts}" fill="${c}"/>`;
  const C = (cx, cy, r, c) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/>`;
  const star = (cx, cy, r, c, n = 5, rot = -90, inner = .38) => { let p = [];
    for (let i = 0; i < n * 2; i++) { const rr = i % 2 ? r * inner : r, a = (rot + i * 180 / n) * Math.PI / 180;
      p.push((cx + rr * Math.cos(a)).toFixed(2) + "," + (cy + rr * Math.sin(a)).toFixed(2)); }
    return P(p.join(" "), c); };
  const cres = (cx, cy, r, c, bg, dx = .3) => C(cx, cy, r, c) + C(cx + r * dx, cy, r * .8, bg);
  const nordic = (bg, c1, c2) => R(0, 0, W, H, bg) + R(6.5, 0, 4, H, c1) + R(0, 7, W, 4, c1) + (c2 ? R(7.5, 0, 2, H, c2) + R(0, 8, W, 2, c2) : "");
  const jack = (w = W, h = H) => { const L = (x1, y1, x2, y2, c, sw) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${sw}"/>`;
    return R(0, 0, w, h, "#012169") + L(0, 0, w, h, "#fff", h * .2) + L(w, 0, 0, h, "#fff", h * .2) + L(0, 0, w, h, "#C8102E", h * .07) + L(w, 0, 0, h, "#C8102E", h * .07)
      + R(0, h * .4, w, h * .2, "#fff") + R(w / 2 - h * .1, 0, h * .2, h, "#fff") + R(0, h * .44, w, h * .12, "#C8102E") + R(w / 2 - h * .06, 0, h * .12, h, "#C8102E"); };
  const panA = (s) => `<g>${s}</g>`;
  const F = {
    jo: hs(["#000", "#fff", "#007A3D"]) + P("0,0 12,9 0,18", "#CE1126") + star(4.3, 9, 1.4, "#fff", 7, -90, .5),
    ps: hs(["#000", "#fff", "#009736"]) + P("0,0 9,9 0,18", "#EE2A35"),
    ae: vs(["#FF0000", "#fff"], [1, 3]) + R(6, 0, 18, 6, "#00732F") + R(6, 12, 18, 6, "#000"),
    kw: hs(["#007A3D", "#fff", "#CE1126"]) + P("0,0 6,6 6,12 0,18", "#000"),
    sy: hs(["#007A3D", "#fff", "#000"]) + star(7.5, 9, 1.6, "#CE1126") + star(12, 9, 1.6, "#CE1126") + star(16.5, 9, 1.6, "#CE1126"),
    eg: hs(["#CE1126", "#fff", "#000"]) + P("12,6.8 13.4,8 13,10.8 11,10.8 10.6,8", "#C09300"),
    ye: hs(["#CE1126", "#fff", "#000"]),
    sd: hs(["#D21034", "#fff", "#000"]) + P("0,0 8,9 0,18", "#007229"),
    ly: hs(["#E70013", "#000", "#239E46"], [1, 2, 1]) + cres(11, 9, 2.4, "#fff", "#000", .35) + star(14.2, 9, 1.1, "#fff"),
    tn: R(0, 0, W, H, "#E70013") + C(12, 9, 4.5, "#fff") + cres(12, 9, 3.3, "#E70013", "#fff", .3) + star(13, 9, 1.8, "#E70013"),
    ma: R(0, 0, W, H, "#C1272D") + star(12, 9.4, 4, "#006233", 5, -90, .38).replace('fill="#006233"', 'fill="none" stroke="#006233" stroke-width="1"'),
    dz: vs(["#006233", "#fff"]) + cres(12, 9, 4, "#D21034", "#fff", .3) + star(13.8, 9, 1.8, "#D21034", 5, 180),
    qa: R(0, 0, W, H, "#8A1538") + P("0,0 7,0 9,1 7,2 9,3 7,4 9,5 7,6 9,7 7,8 9,9 7,10 9,11 7,12 9,13 7,14 9,15 7,16 9,17 7,18 0,18", "#fff"),
    bh: R(0, 0, W, H, "#CE1126") + P("0,0 6,0 9,1.8 6,3.6 9,5.4 6,7.2 9,9 6,10.8 9,12.6 6,14.4 9,16.2 6,18 0,18", "#fff"),
    sa: R(0, 0, W, H, "#006C35") + R(7, 12.2, 10, .8, "#fff") + R(16.4, 11.6, .6, 2, "#fff")
        + `<path d="M7 8.5 q1 -2 2 0 t2 0 t2 0 t2 0 t2 0" fill="none" stroke="#fff" stroke-width=".8"/>`,
    lb: hs(["#EE161F", "#fff", "#EE161F"], [1, 2, 1]) + P("12,5.2 15.2,11 13,11 13,12.4 11,12.4 11,11 8.8,11", "#00A651"),
    tr: R(0, 0, W, H, "#E30A17") + cres(9, 9, 4.2, "#fff", "#E30A17", .25) + star(13.3, 9, 1.8, "#fff", 5, 180),
    pk: vs(["#fff", "#01411C"], [1, 3]) + cres(15, 9, 4, "#fff", "#01411C", .3) + star(17, 7.4, 1.4, "#fff", 5, -60),
    us: hs(Array.from({ length: 13 }, (_, i) => i % 2 ? "#fff" : "#B22234")) + R(0, 0, 10, 9.7, "#3C3B6E")
        + Array.from({ length: 20 }, (_, i) => C(1.2 + (i % 5) * 1.9, 1.2 + Math.floor(i / 5) * 2.3, .45, "#fff")).join(""),
    gb: jack(),
    au: R(0, 0, W, H, "#012169") + `<svg width="12" height="9" viewBox="0 0 24 18">${jack()}</svg>` + star(6, 13.8, 2, "#fff", 7, -90, .45)
        + star(18, 3.5, 1, "#fff", 7, -90, .45) + star(15, 8, 1, "#fff", 7, -90, .45) + star(18, 15, 1, "#fff", 7, -90, .45) + star(21, 7, 1, "#fff", 7, -90, .45),
    nz: R(0, 0, W, H, "#012169") + `<svg width="12" height="9" viewBox="0 0 24 18">${jack()}</svg>` + star(18, 4, 1.2, "#C8102E") + star(16, 8.5, 1.2, "#C8102E") + star(20.5, 7.5, 1.1, "#C8102E") + star(18, 14, 1.3, "#C8102E"),
    ca: vs(["#D52B1E", "#fff", "#D52B1E"], [1, 2, 1]) + P("12,3.5 12.9,5.6 14.4,5 13.9,8 15.8,7 15.3,9.2 16.4,9.6 13.5,11.8 13.8,13 12.3,12.7 12.3,15 11.7,15 11.7,12.7 10.2,13 10.5,11.8 7.6,9.6 8.7,9.2 8.2,7 10.1,8 9.6,5 11.1,5.6", "#D52B1E"),
    fr: vs(["#0055A4", "#fff", "#EF4135"]), it: vs(["#009246", "#fff", "#CE2B37"]), ie: vs(["#169B62", "#fff", "#FF883E"]),
    be: vs(["#000", "#FDDA24", "#EF3340"]), ng: vs(["#008751", "#fff", "#008751"]), mx: vs(["#006847", "#fff", "#CE1126"]) + C(12, 9, 1.8, "#8C6B3F"),
    de: hs(["#000", "#DD0000", "#FFCE00"]), nl: hs(["#AE1C28", "#fff", "#21468B"]), ru: hs(["#fff", "#0039A6", "#D52B1E"]),
    ua: hs(["#0057B7", "#FFD700"]), pl: hs(["#fff", "#DC143C"]), id: hs(["#CE1126", "#fff"]), at: hs(["#C8102E", "#fff", "#C8102E"]),
    th: hs(["#A51931", "#fff", "#2D2A4A", "#fff", "#A51931"], [1, 1, 2, 1, 1]), es: hs(["#AA151B", "#F1BF00", "#AA151B"], [1, 2, 1]),
    co: hs(["#FCD116", "#003893", "#CE1126"], [2, 1, 1]), ar: hs(["#74ACDF", "#fff", "#74ACDF"]) + C(12, 9, 1.8, "#F6B40E"),
    in: hs(["#FF9933", "#fff", "#138808"]) + `<circle cx="12" cy="9" r="2.2" fill="none" stroke="#000080" stroke-width=".5"/>` + C(12, 9, .5, "#000080"),
    ke: hs(["#000", "#fff", "#BB0000", "#fff", "#006600"], [5, 1, 5, 1, 5]) + `<ellipse cx="12" cy="9" rx="2.2" ry="4.5" fill="#BB0000" stroke="#000" stroke-width=".4"/>`,
    pt: vs(["#006600", "#FF0000"], [2, 3]) + C(9.6, 9, 3.2, "#FFE000") + R(8.4, 7.2, 2.4, 3.4, "#fff") + R(8.9, 7.8, 1.4, 2.2, "#003399"),
    br: R(0, 0, W, H, "#009C3B") + P("12,2 22,9 12,16 2,9", "#FFDF00") + C(12, 9, 4, "#002776") + `<path d="M8.2 8.3 q4 -1.2 7.7 1.2" stroke="#fff" stroke-width=".7" fill="none"/>`,
    cl: hs(["#fff", "#D52B1E"]) + R(0, 0, 8, 9, "#0039A6") + star(4, 4.5, 2, "#fff"),
    jp: R(0, 0, W, H, "#fff") + C(12, 9, 5.4, "#BC002D"),
    kr: R(0, 0, W, H, "#fff") + `<path d="M8 9 a4 4 0 0 1 8 0 a2 2 0 0 1 -4 0 a2 2 0 0 0 -4 0z" fill="#CD2E3A"/><path d="M8 9 a4 4 0 0 0 8 0 a2 2 0 0 1 -4 0 a2 2 0 0 0 -4 0z" fill="#0047A0"/>`
        + [[4.2, 3.6, 35], [19.8, 3.6, -35], [4.2, 14.4, -35], [19.8, 14.4, 35]].map(([x, y, a]) => `<g transform="rotate(${a} ${x} ${y})">${R(x - 2, y - 1.6, 4, .8, "#000")}${R(x - 2, y - .4, 4, .8, "#000")}${R(x - 2, y + .8, 4, .8, "#000")}</g>`).join(""),
    cn: R(0, 0, W, H, "#EE1C25") + star(4, 4.5, 2.7, "#FFFF00") + star(8, 1.8, .9, "#FFFF00", 5, -60) + star(9.6, 3.6, .9, "#FFFF00", 5, -75) + star(9.6, 6, .9, "#FFFF00", 5, -100) + star(8, 7.6, .9, "#FFFF00", 5, -120),
    vn: R(0, 0, W, H, "#DA251D") + star(12, 9.4, 5, "#FFFF00"),
    gr: hs(Array.from({ length: 9 }, (_, i) => i % 2 ? "#fff" : "#0D5EAF")) + R(0, 0, 10, 10, "#0D5EAF") + R(4, 0, 2, 10, "#fff") + R(0, 4, 10, 2, "#fff"),
    ch: R(0, 0, W, H, "#DA291C") + R(10.3, 4, 3.4, 10, "#fff") + R(7, 7.3, 10, 3.4, "#fff"),
    se: nordic("#006AA7", "#FECC00"), no: nordic("#BA0C2F", "#fff", "#00205B"), fi: nordic("#fff", "#003580"), dk: nordic("#C8102E", "#fff"),
  };
  const uri = k => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 18" preserveAspectRatio="none">${F[k]}</svg>`)}")`;
  const keys = ["us","gb","us","gb","cn","jp","de","fr","in","br","ca","au","ru","it","kr","es","mx","tr","sa","eg","ae"];
  let pool = [];
  const next = () => { if (!pool.length) pool = keys.slice().sort(() => Math.random() - .5); return pool.pop(); };
  document.querySelectorAll(".b").forEach(b => {
    const f = b.querySelector(".fi");
    const set = () => { f.style.backgroundImage = uri(b.classList.contains("jo") ? "jo" : next()); };
    set();
    b.addEventListener("animationiteration", set);
  });
  
})();
</script>
</body>
</html>
